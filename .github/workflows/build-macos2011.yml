name: Build Mac 2011 legacy candidate
on:
  workflow_dispatch:
  push:
    branches: ['build/localdoc-*']
    paths:
      - '.github/workflows/build-macos2011.yml'
      - 'requirements-macos2011.txt'
      - 'localdoc/**'
      - 'main.py'
      - 'scripts/build-macos2011-native.sh'
      - 'scripts/build-legacy-llama.py'
      - 'scripts/audit-macos-minimum.py'
      - 'scripts/prepare-assets.py'
      - 'LocalDocRenamer.spec'
concurrency:
  group: legacy-mac-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos2011:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'
      LOCALDOC_LEGACY_MAC: '1'
      CMAKE_ARGS: '-DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DGGML_METAL=OFF -DGGML_ACCELERATE=OFF -DGGML_BLAS=OFF -DGGML_OPENMP=OFF -DGGML_RPC=OFF -DGGML_BACKEND_DL=OFF -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=OFF -DGGML_AVX512=OFF -DGGML_AVX_VNNI=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_BMI2=OFF'
    steps:
      - uses: actions/checkout@v4
      - name: Install official Python with old macOS deployment target
        run: |
          curl --fail --location --retry 3 https://www.python.org/ftp/python/3.10.11/python-3.10.11-macos11.pkg -o python.pkg
          sudo installer -pkg python.pkg -target /
          bash "/Applications/Python 3.10/Install Certificates.command"
          echo '/Library/Frameworks/Python.framework/Versions/3.10/bin' >> "$GITHUB_PATH"
          rm python.pkg
      - name: Install build tools and legacy Python dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          python3 -m pip install -r requirements-macos2011.txt huggingface_hub
      - name: Build patched legacy CPU engine
        run: python3 scripts/build-legacy-llama.py
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            vendor/tesseract/tesseract
            vendor/antiword
            vendor/licenses/legacy-native-source
          key: legacy-macos10.13-native-${{ hashFiles('scripts/build-macos2011-native.sh') }}
      - name: Compile old-OS native OCR
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-macos2011-native.sh
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            vendor/tesseract/tesseract
            vendor/antiword
            vendor/licenses/legacy-native-source
          key: legacy-macos10.13-native-${{ hashFiles('scripts/build-macos2011-native.sh') }}
      - name: Stage public model and languages
        run: python3 scripts/prepare-assets.py
      - name: Tests and bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 scripts/preflight.py
          python3 -m unittest discover -s tests -v
          python3 -m PyInstaller --noconfirm --clean LocalDocRenamer.spec
          python3 scripts/audit-macos-minimum.py dist/LocalDocRenamer.app 10.13
          codesign --force --deep --sign - dist/LocalDocRenamer.app
          codesign --verify --deep --strict dist/LocalDocRenamer.app
          env -u PYTHONPATH -u PYTHONHOME -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH PATH=/usr/bin:/bin:/usr/sbin:/sbin dist/LocalDocRenamer.app/Contents/MacOS/LocalDocRenamer --self-test "$PWD/macos2011-selftest.json"
      - name: Create DMG candidate
        run: |
          mkdir -p release/dmg
          cp -R dist/LocalDocRenamer.app release/dmg/
          ln -s /Applications release/dmg/Applications
          hdiutil create -volname LocalDocRenamer -srcfolder release/dmg -ov -format UDZO release/LocalDocRenamer-macOS10.13-Intel-candidate.dmg
          rm -rf release/dmg
          shasum -a 256 release/*.dmg > release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mac2011-HighSierra-installer-candidate
          path: |
            release/*.dmg
            release/SHA256.txt
            macos2011-selftest.json
            asset-provenance.json
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Mac2011-build-diagnostics
          path: '*selftest.json'
          if-no-files-found: ignore
          retention-days: 7
